[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# analyser-facture embarque le pipeline OCR (Phase 3) : rastérisation PDF
# (@napi-rs/canvas, binaire natif) + reconnaissance de texte (tesseract.js,
# fichiers wasm + worker). `external_node_modules` empêche esbuild d'essayer
# de rebundler ces paquets (binaire natif + wasm, incompatibles avec un
# bundling classique) : leur dossier node_modules est copié tel quel. Mais
# pdfjs-dist et tesseract.js chargent certains de leurs propres fichiers
# (worker, cœur wasm) via un chemin calculé à l'exécution plutôt qu'un
# `import`/`require` littéral : l'analyse statique de Netlify ne les détecte
# pas et les omet du paquet déployé (constaté en production : "Cannot find
# module .../pdf.worker.mjs"). `included_files` les force explicitement,
# ainsi que les données de langue françaises de l'OCR.
[functions."analyser-facture"]
  external_node_modules = ["@napi-rs/canvas", "tesseract.js", "tesseract.js-core", "pdfjs-dist"]
  included_files = [
    "netlify/functions/lib/ocr/lang-data/**",
    "node_modules/pdfjs-dist/**",
    "node_modules/tesseract.js/**",
    "node_modules/tesseract.js-core/**",
    "node_modules/@napi-rs/**",
  ]

# apercu-export dessine l'aperçu d'export (lib/export/renderPreviewImage.js)
# avec @napi-rs/canvas (binaire natif) : même traitement que ci-dessus. En
# plus : l'environnement d'exécution des Netlify Functions n'a aucune police
# système, donc le texte dessiné serait invisible sans une police embarquée
# explicitement enregistrée (voir renderPreviewImage.js) — on réutilise les
# polices standard de pdfjs-dist (Liberation Sans, chargée à l'exécution via
# un chemin de fichier, non détectée par l'analyse statique de Netlify).
[functions."apercu-export"]
  external_node_modules = ["@napi-rs/canvas"]
  included_files = [
    "node_modules/@napi-rs/**",
    "node_modules/pdfjs-dist/standard_fonts/*.ttf",
  ]

# Toutes les fonctions serverless sont exposées sous /api/*.
# Cette règle est évaluée avant le fallback SPA ci-dessous.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true

# Fallback SPA : toute autre route sert index.html (React Router prend le relais).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
